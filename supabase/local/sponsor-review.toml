# Isolated sponsor review only. Never linked to the hosted project.
project_id = "shpe-sponsors-local"

[api]
port = 55431
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55430
major_version = 17

[db.seed]
enabled = false

[auth]
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://localhost:5173"]
enable_signup = false

[analytics]
enabled = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.manage-sponsor-assets]
verify_jwt = false
