project_id = "shpe-osu"

# Students are not signed in. This function is public at the gateway and does
# its authentication in-handler with a server-verified Turnstile token. The
# database RPC it calls remains service-role-only.
[functions.submit-attendance]
verify_jwt = false

[functions.submit-resume]
verify_jwt = false

[functions.submit-sponsor-inquiry]
verify_jwt = false

# This endpoint requires a signed-in ADMIN. The handler verifies the bearer
# token through Supabase Auth and checks server-controlled app_metadata.role.
# Disabling the legacy gateway verifier supports current JWT signing keys;
# missing/invalid/non-admin sessions are still rejected before any queue access.
[functions.cleanup-resume-files]
verify_jwt = false

# Logo uploads and cleanup verify a real admin bearer in-handler before any
# request body parsing, image decoding, registry or Storage work.
[functions.manage-sponsor-assets]
verify_jwt = false
